syntax = "proto3";

package gateway;

option go_package = "gateway/internal/proto;gatewaypb";

// 命令枚举
enum Command {
  CMD_UNSPECIFIED     = 0;
  CMD_HEALTH          = 1;
  CMD_REGISTER        = 2;
  CMD_LOGIN           = 3;
  CMD_CHANGE_PASSWORD = 4;
  CMD_ACCOUNT_INFO    = 5;
  CMD_ACCOUNT_RESET   = 6; // 管理接口：无需旧密码强制重置密码
  CMD_SEND_ITEMS      = 7; // 管理接口：系统邮件投递物品/装备/宠物
  CMD_GET_ROLES       = 8; // 管理接口：查询账号角色二维数据(树)
  CMD_CLEAR_MAILBOX   = 9; // 管理接口：清空角色邮箱（软删除打标，GM 不要求先领附件）
  CMD_UPDATE_ROLE     = 10; // 管理接口：修改角色基础数据（改名/设等级/转职觉醒），仅适用于离线角色
  CMD_CLEAR_INVENTORY = 11; // 管理接口：按物品类别分类清除角色背包槽位（仓库/穿戴栏不可清），仅适用于离线角色
}

// 通用请求头（TCP + UDP + WebSocket 共用）
message Request {
  uint32 sequence  = 1;
  int64  timestamp = 2;
  uint32 command   = 3;
  bytes  body      = 4;
  string auth_key  = 5;
}

// 通用响应头
message Response {
  uint32 sequence  = 1;
  bool   success   = 2;
  int32  code      = 3;
  string message   = 4;
  bytes  body      = 5;
}

// --- CMD_HEALTH ---
message HealthResponse {
  string status       = 1;
  string service      = 2;
  bool   channel_port = 3;
  bool   game_port    = 4;
}

// --- CMD_REGISTER ---
message RegisterRequest {
  string m_id             = 1;
  string password         = 2;
  string password_confirm = 3;
}
message RegisterResponse {
  int64  account_id = 1;
  string m_id       = 2;
}

// --- CMD_LOGIN ---
message LoginRequest {
  string m_id      = 1;
  string password  = 2;
}
message LoginResponse {
  int64  account_id    = 1;
  string m_id          = 2;
  int64  cera          = 3;
  string password_hash = 4;
  string launch_args   = 5;
}

// --- CMD_CHANGE_PASSWORD ---
message ChangePasswordRequest {
  string m_id                 = 1;
  string old_password         = 2;
  string new_password         = 3;
  string new_password_confirm = 4;
}

// --- CMD_ACCOUNT_INFO ---
message AccountInfoRequest {
  string m_id = 1;
}
message AccountInfoResponse {
  int64  account_id        = 1;
  string m_id              = 2;
  int64  cera              = 3;
  int64  token_cera        = 4;
  int64  happy_token_cera  = 5;
  int64  lucky_star        = 6;
  int64  seria_luck_value  = 7;
  int64  cube_black        = 8;
  int64  cube_white        = 9;
  int64  cube_red          = 10;
  int64  cube_blue         = 11;
  int64  cube_clear        = 12;
  int64  cube_gold         = 13;
  string created_at        = 14;
  string last_login_at     = 15;
  string last_login_ip     = 16;
}

// --- CMD_ACCOUNT_RESET ---
message AccountResetPasswordRequest {
  string m_id                 = 1;
  string new_password         = 2;
  string new_password_confirm = 3;
}

// --- CMD_SEND_ITEMS ---
// 邮件附件：一条物品/装备/宠物，写入 mailbox_attachments 并编码为 99B item_core BLOB（82B legacy + 17B A21 尾）。
message MailAttachment {
  int32 item_id               = 1; // 物品模板ID
  int32 count                 = 2; // 堆叠数量（堆叠类可 >1，非堆叠类固定 1）
  // 物品种类（对齐服务端 ItemCore 枚举，0-14）：
  //   0=未知 1=装备 2=消耗品 3=材料 4=任务 5=宠物(本体) 6=宠物装备 7=宠物消耗品
  //   8=时装 9=时装徽章 10=副职业材料 11=特殊材料 12=公会勋章 13=守护珠 14=史诗碎片
  // 非堆叠类型（Value=InstanceValue/Uid，count 固定 1）：1=装备 5=宠物 6=宠物装备 8=时装 12=公会勋章；
  // 其余为堆叠类型（Value=Count）。网关接受的合法组合（与权威 GM 工具一致）：
  //   主背包(0)配 kind=1/2/3/9/10/12/13；时装(1)配 kind=8；宠物(3|7)配 kind=5/6/7。
  //   11=特殊材料（账号仓库物品）与 14=史诗碎片（账号图鉴通道）不能作为邮件附件，
  //   与权威 GM 工具附件黑名单一致；4=任务品暂未开放。
  //   公会勋章(12)/守护珠(13)领取后由服务端按 ItemKind 路由到公会列表(GuildMedal 38)。
  int32 kind                  = 3; // 必填，1-14（11/14 拒收）；0 非法
  int32 upgrade_level         = 4; // 强化/增幅等级（0-31，仅装备类 kind=1/12）
  int32 amplify_type          = 5; // 红字类型/增幅类型（仅装备类 kind=1/12）
  // 来源列表类型：决定客户端将该物品放入哪个背包列表。与 kind 是两个独立维度，
  // 必须匹配（服务端强制校验，不匹配返回 code=1014）：
  //   0 = 主背包（默认）：装备/消耗品/材料/时装徽章/副职业材料/公会勋章/守护珠（kind=1/2/3/9/10/12/13）
  //   2 = 主背包（次要入口，权威 MapMailboxItemType case 2 -> Main）：允许 kind 同 0
  //   1 = 时装列表（Avatar）：须配 kind=8 时装
  //   3|7 = 宠物列表（Pet）：须配 kind=5/6/7 宠物系
  // 映射（对齐 GMTool MapMailboxItemType / InventoryListType 枚举）：
  //   0->0(Main) 1->1(Avatar) 2->0(Main) 3|7->7(Pet)，其余取值非法（code=1014）
  // item_type 列落库请求原值，映射值只写入 source_list_type 列。
  // 服务端 InventoryListType 完整枚举（邮箱入口仅用到 Main/Avatar/Pet）：
  //   0=Main(主背包) 1=Avatar(时装) 2=PersonalCargo(个人金库) 3=Equipment(穿戴装备)
  //   7=Pet(宠物) 12=AccountCargo(账号金库) 29=QuickSlot(快捷栏) 38=GuildMedal(公会勋章) 等
  int32 item_type             = 6;
  // 宠物序列号/句柄：仅对宠物类物品（kind=5 宠物本体）有意义；装备/消耗品/材料/时装等应保持 0。
  // 写入 mailbox_attachments.pet_serial_or_handle 列，同时编入 99B item_core BLOB 的 Value 字段（CreatureUid）。
  int32 pet_serial_or_handle  = 7;
  // 到期时间戳（Unix 秒，0=永久）：适用于限时类物品（如限时装备 kind=1、限时时装 kind=8、
  // 限时宠物 kind=5）；消耗品/材料等永久物品填 0。
  // 写入 mailbox_attachments.expire_time 列，同时编入 99B item_core BLOB 的 ExpireTime 字段。
  int32 expire_time           = 8;
}
message SendItemsRequest {
  string m_id                        = 1; // 目标账号
  int32  character_id                = 2; // 收件角色ID（必填，必须 > 0）
  string title                       = 3; // 邮件标题
  string body                        = 4; // 邮件正文
  repeated MailAttachment attachments = 5; // 附件（按 10 条/封上限自动拆分多封）
  string idempotency_key             = 6; // 可选幂等键：非空时相同键的重试不重复投递（多封时按序号派生独立键）
}
message SendItemsResponse {
  int64  message_id     = 1; // 首封邮件 message_id
  int32  character_id   = 2; // 实际收件角色
  string character_name = 3; // 实际收件角色名
  int32  mail_count     = 4; // 实际投递邮件封数
}

// --- CMD_GET_ROLES ---
message GetRolesRequest {
  string m_id = 1;
}
message RoleInfo {
  int64  character_id         = 1;
  string name                 = 2;
  int32  job                  = 3;
  int32  grow_type            = 4;
  int32  level                = 5;
  int32  exp                  = 6;
  int32  pvp_grade            = 7;
  int32  pvp_rating_grade     = 8;
  int32  user_state           = 9;
  int32  town_id              = 10;
  int32  area_id              = 11;
  int32  slot_index           = 12;
  int64  stat_hp_max          = 13; // 生命上限（character_subtype1_fields）
  int64  stat_mp_max          = 14; // 魔力上限
  int32  stat_physical_attack = 15; // 物理攻击
  int32  stat_magical_attack  = 16; // 魔法攻击
  string created_at           = 17;
  string updated_at           = 18;
}
message AccountRoleTree {
  int64  account_id = 1;
  string m_id       = 2;
  repeated RoleInfo roles = 3;
}

// --- CMD_UPDATE_ROLE ---
// 角色基础数据修改请求。除定位字段外的业务字段均为 proto3 optional：
// 未提供（未置位）的字段不做任何修改、不触发任何表的联动更新；全部未提供时报参数错误。
// 仅适用于离线角色：在线角色的内存态会冲掉本次直改。设等级或转职/觉醒实际变更时
// 清空已学技能，下次选角由服务端自动重建技能面板并派生 SP/TP。
message UpdateRoleRequest {
  string m_id             = 1; // 目标账号
  int32  character_id     = 2; // 目标角色ID（必填，必须 > 0）
  optional string name    = 3; // 改名：UTF-8 文本，GBK 编码后须 2-18 字节，仅限中文/英文/数字；全库唯一（含已删除角色）；与当前同名时视为未改动
  optional int32  level   = 4; // 设等级：1-86；累计经验按网关内置阈值快照联动写入；与当前等级相同时视为未改动
  optional int32  grow_first   = 5; // 转职分支 0-5；必须与 grow_second 同时提供
  optional int32  grow_second  = 6; // 觉醒档位 0-2；grow_first=0 时只能为 0
}
message UpdateRoleResponse {
  int64  account_id        = 1;
  int32  character_id      = 2;
  string character_name    = 3;      // 修改后的角色名
  bool   name_updated      = 4;      // 本次是否实际改了名
  bool   level_updated     = 5;      // 本次是否实际改了等级/经验
  bool   grow_type_updated = 6;      // 本次是否实际改了转职/觉醒编码
  bool   skills_reset      = 7;      // 本次是否清空了已学技能
  int32  level             = 8;      // 当前等级
  int64  exp               = 9;      // 当前累计经验
  int32  grow_type         = 10;     // 当前 grow_type 原始编码 ((second<<4)|first)
}

// --- CMD_CLEAR_MAILBOX ---
message ClearMailboxRequest {
  string m_id         = 1; // 目标账号
  int32  character_id = 2; // 收件角色ID（必填，必须 > 0）
}
message ClearMailboxResponse {
  int64  account_id     = 1; // 账号ID
  int32  character_id   = 2; // 实际清理角色
  string character_name = 3; // 实际清理角色名
  int32  deleted_count  = 4; // 本次打删除标记的邮件数（0 表示无可清理邮件，仍为成功）
}

// --- CMD_CLEAR_INVENTORY ---
// 按物品类别（ItemKind 口径）分类清除角色背包槽位。仅适用于离线角色：
// 在线角色的背包真源在服务端内存，直改 DB 会被内存态覆盖。
// 清除分类（categories 取值 = 权威 ItemKind 值）与清除范围（槽位段含两端）：
//   1  物品栏·装备     Main(0)          slot 9-64
//   2  物品栏·消耗品   Main(0)          slot 65-120
//   3  物品栏·材料     Main(0)          slot 121-176
//   4  物品栏·任务     Main(0)          slot 177-232
//   5  宠物·宠物       Pet(7)           slot 0-139
//   6  宠物·宠物装备   Pet(7)           slot 140-188
//   7  宠物·消耗品     Pet(7)           slot 189-239
//   8  装扮·装扮       Avatar(1)        整容器 slot 0-209
//   9  装扮·徽章       Main(0)          slot 289-351
//   10 物品栏·副职业   Main(0)          slot 233-288
//   12 勋章·勋章       GuildMedal(38)   slot 0-48
//   13 勋章·守护珠     GuildMedal(38)   slot 49-97
// 不在清除范围：个人仓库(2)、账号仓库(12)、穿戴栏 Equipment(3)（唯一穿戴态容器，
// 穿戴装备 = 武器/称号/防具/首饰/辅助装备/副武器/魅力，穿戴中的时装、出战宠物、
// 宠物神器装备、穿戴勋章）、主背包快捷栏段、货币槽、晶块/灵魂（accounts 同源）、
// 预留段、特殊材料（ItemKind 11，无对应 UI 分类）、称号簿/QuickSlot/骑士盾、
// 史诗碎片（账号图鉴通道）。
// categories 白名单为 1-10、12、13；白名单外取值（含 11/14/101/102 等）返回 code=1020。
// 删除为物理 DELETE（不是数量置 0）；清装扮(8)联动删 character_avatar_detail、
// 清宠物(5)联动删 character_creatures；装备锁记录原样保留；
// 逐槽写入 inventory_audit_log；不发系统邮件、不触碰点券（accounts.cera）。
message ClearInventoryRequest {
  string m_id         = 1; // 目标账号
  int32  character_id = 2; // 目标角色ID（必填，必须 > 0）
  // 可选分类过滤（清除分类，取值 = 权威 ItemKind 值）：为空 = 清全部 12 个分类
  // （1-10、12、13）；非空 = 仅清指定分类（白名单校验，未定义取值返回 code=1020）
  repeated int32 categories = 3;
}
message ClearInventoryListResult {
  int32 category      = 1; // 清除分类（权威 ItemKind 值）
  int32 deleted_count = 2; // 该分类本次删除的物品行数
}
message ClearInventoryResponse {
  int64  account_id     = 1; // 账号ID
  int32  character_id   = 2; // 实际清理角色
  string character_name = 3; // 实际清理角色名
  int32  deleted_count  = 4; // 本次删除的物品总行数（0 表示无可清理物品，仍为成功）
  repeated ClearInventoryListResult results = 5; // 按分类细分的删除计数
}
