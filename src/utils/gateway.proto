syntax = "proto3";

package gateway;

option go_package = "gateway/internal/proto;gatewaypb";

// 命令枚举
enum Command {
  CMD_UNSPECIFIED     = 0;
  CMD_HEALTH          = 1;
  CMD_REGISTER        = 2;
  CMD_LOGIN           = 3;
  CMD_CHANGE_PASSWORD = 4;
  CMD_ACCOUNT_INFO    = 5;
  CMD_ACCOUNT_RESET   = 6; // 管理接口：无需旧密码强制重置密码
  CMD_SEND_ITEMS      = 7; // 管理接口：系统邮件投递物品/装备/宠物
  CMD_GET_ROLES       = 8; // 管理接口：查询账号角色二维数据(树)
}

// 通用请求头（TCP + UDP + WebSocket 共用）
message Request {
  uint32 sequence  = 1;
  int64  timestamp = 2;
  uint32 command   = 3;
  bytes  body      = 4;
  string auth_key  = 5;
}

// 通用响应头
message Response {
  uint32 sequence  = 1;
  bool   success   = 2;
  int32  code      = 3;
  string message   = 4;
  bytes  body      = 5;
}

// --- CMD_HEALTH ---
message HealthResponse {
  string status       = 1;
  string service      = 2;
  bool   channel_port = 3;
  bool   game_port    = 4;
}

// --- CMD_REGISTER ---
message RegisterRequest {
  string m_id             = 1;
  string password         = 2;
  string password_confirm = 3;
}
message RegisterResponse {
  int64  account_id = 1;
  string m_id       = 2;
}

// --- CMD_LOGIN ---
message LoginRequest {
  string m_id      = 1;
  string password  = 2;
}
message LoginResponse {
  int64  account_id    = 1;
  string m_id          = 2;
  int64  cera          = 3;
  string password_hash = 4;
  string launch_args   = 5;
}

// --- CMD_CHANGE_PASSWORD ---
message ChangePasswordRequest {
  string m_id                 = 1;
  string old_password         = 2;
  string new_password         = 3;
  string new_password_confirm = 4;
}

// --- CMD_ACCOUNT_INFO ---
message AccountInfoRequest {
  string m_id = 1;
}
message AccountInfoResponse {
  int64  account_id        = 1;
  string m_id              = 2;
  int64  cera              = 3;
  int64  token_cera        = 4;
  int64  happy_token_cera  = 5;
  int64  lucky_star        = 6;
  int64  seria_luck_value  = 7;
  int64  cube_black        = 8;
  int64  cube_white        = 9;
  int64  cube_red          = 10;
  int64  cube_blue         = 11;
  int64  cube_clear        = 12;
  int64  cube_gold         = 13;
  string created_at        = 14;
  string last_login_at     = 15;
  string last_login_ip     = 16;
}

// --- CMD_ACCOUNT_RESET ---
message AccountResetPasswordRequest {
  string m_id                 = 1;
  string new_password         = 2;
  string new_password_confirm = 3;
}

// --- CMD_SEND_ITEMS ---
// 邮件附件：一条物品/装备/宠物，写入 mailbox_attachments 并编码为 99B item_core BLOB（82B legacy + 17B A21 尾）。
message MailAttachment {
  int32 item_id               = 1; // 物品模板ID
  int32 count                 = 2; // 堆叠数量（消耗品/材料可 >1，装备/宠物建议 1）
  // 物品种类（对齐服务端 ItemCore 枚举，0-14）：
  //   0=未知 1=装备 2=消耗品 3=材料 4=任务 5=宠物(本体) 6=宠物装备 7=宠物消耗品
  //   8=时装 9=时装徽章 10=副职业材料 11=特殊材料 12=公会勋章 13=守护珠 14=史诗碎片
  // 非堆叠类型（Value=InstanceValue/Uid，count 固定 1）：1=装备 5=宠物 6=宠物装备 8=时装 12=公会勋章；
  // 其余为堆叠类型（Value=Count）。网关当前仅接受合法组合：
  //   主背包(0)配 kind=1/2/3；时装(1)配 kind=8；宠物(3|7)配 kind=5/6/7。
  //   4 任务/9 时装徽章/10 副职业材料/11 特殊材料/12 公会勋章/13 守护珠/14 史诗碎片
  //   暂不支持邮件投递（12/13 属公会列表 38 无邮箱入口，14 走服务端账号级特殊通道）。
  int32 kind                  = 3; // 必填，1-11；0 非法
  int32 upgrade_level         = 4; // 强化/增幅等级（0-31，仅装备）
  int32 amplify_type          = 5; // 红字类型/增幅类型（仅装备）
  // 来源列表类型：决定客户端将该物品放入哪个背包列表。与 kind 是两个独立维度，
  // 必须匹配（服务端强制校验，不匹配返回 code=1014）：
  //   0 = 主背包（默认）：装备/消耗品/材料（kind=1/2/3）
  //   1 = 时装列表（Avatar）：须配 kind=8 时装
  //   3|7 = 宠物列表（Pet）：须配 kind=5/6/7 宠物系
  // 映射（对齐 GMTool MapMailboxItemType / InventoryListType 枚举）：
  //   0->0(Main) 1->1(Avatar) 3|7->7(Pet)，其余取值非法（code=1014）
  // 服务端 InventoryListType 完整枚举（邮箱入口仅用到 Main/Avatar/Pet）：
  //   0=Main(主背包) 1=Avatar(时装) 2=PersonalCargo(个人金库) 3=Equipment(穿戴装备)
  //   7=Pet(宠物) 12=AccountCargo(账号金库) 29=QuickSlot(快捷栏) 38=GuildMedal(公会勋章) 等
  int32 item_type             = 6;
  // 宠物序列号/句柄：仅对宠物类物品（kind=5 宠物本体）有意义；装备/消耗品/材料/时装等应保持 0。
  // 写入 mailbox_attachments.pet_serial_or_handle 列，同时编入 99B item_core BLOB 的 Value 字段（CreatureUid）。
  int32 pet_serial_or_handle  = 7;
  // 到期时间戳（Unix 秒，0=永久）：适用于限时类物品（如限时装备 kind=1、限时时装 kind=8、
  // 限时宠物 kind=5）；消耗品/材料等永久物品填 0。
  // 写入 mailbox_attachments.expire_time 列，同时编入 99B item_core BLOB 的 ExpireTime 字段。
  int32 expire_time           = 8;
}
message SendItemsRequest {
  string m_id                        = 1; // 目标账号
  int32  character_id                = 2; // 收件角色ID（必填，必须 > 0）
  string title                       = 3; // 邮件标题
  string body                        = 4; // 邮件正文
  repeated MailAttachment attachments = 5; // 附件（按 10 条/封上限自动拆分多封）
  string idempotency_key             = 6; // 可选幂等键：非空时相同键的重试不重复投递（多封时按序号派生独立键）
}
message SendItemsResponse {
  int64  message_id     = 1; // 首封邮件 message_id
  int32  character_id   = 2; // 实际收件角色
  string character_name = 3; // 实际收件角色名
  int32  mail_count     = 4; // 实际投递邮件封数
}

// --- CMD_GET_ROLES ---
message GetRolesRequest {
  string m_id = 1;
}
message RoleInfo {
  int64  character_id         = 1;
  string name                 = 2;
  int32  job                  = 3;
  int32  grow_type            = 4;
  int32  level                = 5;
  int32  exp                  = 6;
  int32  pvp_grade            = 7;
  int32  pvp_rating_grade     = 8;
  int32  user_state           = 9;
  int32  town_id              = 10;
  int32  area_id              = 11;
  int32  slot_index           = 12;
  int64  stat_hp_max          = 13; // 生命上限（character_subtype1_fields）
  int64  stat_mp_max          = 14; // 魔力上限
  int32  stat_physical_attack = 15; // 物理攻击
  int32  stat_magical_attack  = 16; // 魔法攻击
  string created_at           = 17;
  string updated_at           = 18;
}
message AccountRoleTree {
  int64  account_id = 1;
  string m_id       = 2;
  repeated RoleInfo roles = 3;
}
