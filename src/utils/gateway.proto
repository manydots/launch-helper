syntax = "proto3";

package gateway;

option go_package = "gateway/internal/proto;gatewaypb";

// 命令枚举
enum Command {
  CMD_UNSPECIFIED     = 0;
  CMD_HEALTH          = 1;
  CMD_REGISTER        = 2;
  CMD_LOGIN           = 3;
  CMD_CHANGE_PASSWORD = 4;
  CMD_ACCOUNT_INFO    = 5;
  CMD_ACCOUNT_RESET   = 6; // 管理接口：无需旧密码强制重置密码（原 CMD_ADMIN_RESET，值不变）
  CMD_SEND_ITEMS      = 7; // 管理接口：系统邮件投递物品/装备/宠物
  CMD_GET_ROLES       = 8; // 管理接口：查询账号角色二维数据(树)
}

// 通用请求头（TCP + UDP + WebSocket 共用）
message Request {
  uint32 sequence  = 1;
  int64  timestamp = 2;
  uint32 command   = 3;
  bytes  body      = 4;
  string auth_key  = 5;
}

// 通用响应头
message Response {
  uint32 sequence  = 1;
  bool   success   = 2;
  int32  code      = 3;
  string message   = 4;
  bytes  body      = 5;
}

// --- CMD_HEALTH ---
message HealthResponse {
  string status       = 1;
  string service      = 2;
  bool   channel_port = 3;
  bool   game_port    = 4;
}

// --- CMD_REGISTER ---
message RegisterRequest {
  string m_id             = 1;
  string password         = 2;
  string password_confirm = 3;
}
message RegisterResponse {
  int64  account_id = 1;
  string m_id       = 2;
}

// --- CMD_LOGIN ---
message LoginRequest {
  string m_id      = 1;
  string password  = 2;
}
message LoginResponse {
  int64  account_id    = 1;
  string m_id          = 2;
  int64  cera          = 3;
  string password_hash = 4;
  string launch_args   = 5;
}

// --- CMD_CHANGE_PASSWORD ---
message ChangePasswordRequest {
  string m_id                 = 1;
  string old_password         = 2;
  string new_password         = 3;
  string new_password_confirm = 4;
}

// --- CMD_ACCOUNT_INFO ---
message AccountInfoRequest {
  string m_id = 1;
}
message AccountInfoResponse {
  int64  account_id        = 1;
  string m_id              = 2;
  int64  cera              = 3;
  int64  token_cera        = 4;
  int64  happy_token_cera  = 5;
  int64  lucky_star        = 6;
  int64  seria_luck_value  = 7;
  int64  cube_black        = 8;
  int64  cube_white        = 9;
  int64  cube_red          = 10;
  int64  cube_blue         = 11;
  int64  cube_clear        = 12;
  int64  cube_gold         = 13;
  string created_at        = 14;
  string last_login_at     = 15;
  string last_login_ip     = 16;
}

// --- CMD_ACCOUNT_RESET ---
message AccountResetPasswordRequest {
  string m_id                 = 1;
  string new_password         = 2;
  string new_password_confirm = 3;
}

// --- CMD_SEND_ITEMS ---
// 邮件附件：一条物品/装备/宠物，写入 mailbox_attachments 并编码为 82B item_core BLOB。
message MailAttachment {
  int32 item_id               = 1; // 物品模板ID
  int32 count                 = 2; // 堆叠数量（消耗品/材料可 >1，装备/时装/宠物建议 1）
  int32 kind                  = 3; // 物品种类（必填 1-11，0 非法）：1=装备 2=消耗品 3=材料 5=宠物本体 6=宠物装备 7=宠物消耗品 8=时装 ...
  // 注意：kind 必须与 item_id 对应物品的实际类型一致——网关直接按此编码 82B item_core，
  // 服务端领取时按 kind 字节决定落库列表（8→时装列表、5/6/7→宠物列表），无 PVF 兜底解析，
  // 与 item_type 不一致会被网关拒绝（code=1014）。
  int32 upgrade_level         = 4; // 强化/增幅等级（0-31，仅装备）
  int32 amplify_type          = 5; // 红字类型/增幅类型（仅装备）
  // 来源列表类型：服务端强制校验（必须与 kind 匹配，否则返回 code=1014）：
  //   0 = 主背包（默认）：装备/消耗品/材料（kind=1/2/3）
  //   1 = 时装列表（Avatar=1）：须配 kind=8 时装
  //   3|7 = 宠物列表（Pet=7）：须配 kind=5/6/7 宠物系
  // 映射（对齐服务端 MapMailboxItemType / InventoryListType 枚举）：
  //   0->0(Main) 1->1(Avatar) 3|7->7(Pet)，其余取值非法（code=1014）
  int32 item_type             = 6;
  // 宠物序列号/句柄：仅对宠物本体（kind=5）有意义；系统邮件发放应保持 0——
  // 服务端领取时会将 82B 内宠物 UID 清零并重新分配（mailbox_attachments.pet_serial_or_handle 仅作存档展示）。
  int32 pet_serial_or_handle  = 7;
  // 到期时间戳（Unix 秒，0=永久）：适用于限时类物品（限时装备 kind=1、限时时装 kind=8、
  // 限时宠物 kind=5）；消耗品/材料等永久物品填 0。
  // 网关同时写入 82B item_core 的 ExpireTime 字段与 mailbox_attachments.expire_time 列，
  // 领取时转为时装/宠物 detail 的到期时间。
  int32 expire_time           = 8;
}
message SendItemsRequest {
  string m_id                        = 1; // 目标账号
  int32  character_id                = 2; // 收件角色ID（必填，必须 > 0）
  string title                       = 3; // 邮件标题
  string body                        = 4; // 邮件正文
  repeated MailAttachment attachments = 5; // 附件（按 10 条/封上限自动拆分多封）
  string idempotency_key             = 6; // 可选幂等键：非空时相同键的重试不重复投递（多封时按序号派生独立键）
}
message SendItemsResponse {
  int64  message_id     = 1; // 首封邮件 message_id
  int32  character_id   = 2; // 实际收件角色
  string character_name = 3; // 实际收件角色名
  int32  mail_count     = 4; // 实际投递邮件封数
}

// --- CMD_GET_ROLES ---
message GetRolesRequest {
  string m_id = 1;
}
message RoleInfo {
  int64  character_id         = 1;
  string name                 = 2;
  int32  job                  = 3;
  int32  grow_type            = 4;
  int32  level                = 5;
  int32  exp                  = 6;
  int32  pvp_grade            = 7;
  int32  pvp_rating_grade     = 8;
  int32  user_state           = 9;
  int32  town_id              = 10;
  int32  area_id              = 11;
  int32  slot_index           = 12;
  int64  stat_hp_max          = 13; // 生命上限（character_subtype1_fields）
  int64  stat_mp_max          = 14; // 魔力上限
  int32  stat_physical_attack = 15; // 物理攻击
  int32  stat_magical_attack  = 16; // 魔法攻击
  string created_at           = 17;
  string updated_at           = 18;
}
message AccountRoleTree {
  int64  account_id = 1;
  string m_id       = 2;
  repeated RoleInfo roles = 3;
}
